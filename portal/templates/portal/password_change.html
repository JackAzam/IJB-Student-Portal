{% extends 'portal/base.html' %}

{% block title %}Ubah Password | IJB Student Portal{% endblock %}
{% block breadcrumb %}Akun / Ubah Password{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Ubah Password</h1>
        <p>Perbarui password akun IJB Anda.</p>
    </div>
</div>

<div class="panel form-panel">
    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="primary">
                Simpan Password
            </button>
            <a href="{% url 'dashboard' %}" class="secondary">
                Batal
            </a>
        </div>
    </form>
</div>
{% endblock %}
